<!DOCTYPE html>
<html lang="es" data-theme="a" data-mode="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Veterinaria Los Lapachos - Dashboard</title>
<meta name="theme-color" content="#F6F3EE">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Los Lapachos">
<link rel="apple-touch-icon" href="Veterinaria.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  // Aplicar modo guardado antes de pintar (evita parpadeo)
  (function () {
    let mode = null;
    try { mode = localStorage.getItem('lp-mode'); } catch (e) {}
    if (mode === 'light' || mode === 'dark') document.documentElement.dataset.mode = mode;
  })();
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --ease-out: cubic-bezier(.23, 1, .32, 1);
    --ease-sheet: cubic-bezier(.32, .72, 0, 1);
    --tabbar-h: 66px;
  }

  /* ===== Tema Clínica Clara (claro y oscuro) ===== */
  [data-theme="a"] {
    --font-body: 'Plus Jakarta Sans', system-ui, sans-serif;
    --font-head: 'Plus Jakarta Sans', system-ui, sans-serif;
    --head-weight: 700;
    --radius: 16px;
    --radius-sm: 12px;
  }
  [data-theme="a"][data-mode="light"] {
    --bg: #F6F3EE; --surface: #FFFFFF; --surface-2: #F1ECE6; --text: #2A1A20; --muted: #6E6168;
    --primary: #7A1F3D; --on-primary: #FFFFFF; --primary-soft: #F5E8EC; --accent: #8C9A1E;
    --pos: #2F7D4F; --neg: #B3261E; --warn: #A15C00;
    --border: #E6DED5; --divider: #EFE9E2; --card-border: transparent;
    --hero-bg: #7A1F3D; --hero-text: #FFFFFF; --hero-track: rgba(255,255,255,.18);
    --seg-1: rgba(255,255,255,.6); --seg-2: rgba(255,255,255,.32); --seg-3: #C9D44E;
    --nav-bg: rgba(255,255,255,.92); --nav-on: #7A1F3D; --nav-on-bg: #F5E8EC;
    --top-bg: rgba(246,243,238,.86);
    --shadow-sm: 0 1px 2px rgba(42,26,32,.08);
    --shadow-md: 0 1px 2px rgba(42,26,32,.05), 0 4px 14px rgba(42,26,32,.06);
    --shadow-hero: 0 1px 2px rgba(122,31,61,.2), 0 10px 24px -8px rgba(122,31,61,.45);
    --shadow-nav: 0 8px 28px rgba(42,26,32,.12);
    --backdrop: rgba(30,14,20,.45);
  }
  [data-theme="a"][data-mode="dark"] {
    --bg: #121011; --surface: #1C1719; --surface-2: #272024; --text: #F2ECEE; --muted: #A69A9F;
    --primary: #E58AA6; --on-primary: #2A0E18; --primary-soft: rgba(229,138,166,.14); --accent: #C9D44E;
    --pos: #7FCB8E; --neg: #FF8A80; --warn: #F2B85B;
    --border: rgba(255,255,255,.09); --divider: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.06);
    --hero-bg: #5E1730; --hero-text: #FFFFFF; --hero-track: rgba(255,255,255,.14);
    --seg-1: rgba(255,255,255,.55); --seg-2: rgba(255,255,255,.28); --seg-3: #C9D44E;
    --nav-bg: rgba(28,23,25,.88); --nav-on: #2A0E18; --nav-on-bg: #E58AA6;
    --top-bg: rgba(18,16,17,.86);
    --shadow-sm: 0 0 0 1px rgba(255,255,255,.06);
    --shadow-md: inset 0 1px 0 rgba(255,255,255,.04), 0 8px 22px rgba(0,0,0,.4);
    --shadow-hero: inset 0 1px 0 rgba(255,255,255,.1), 0 14px 30px -10px rgba(0,0,0,.6);
    --shadow-nav: inset 0 1px 0 rgba(255,255,255,.06), 0 12px 30px rgba(0,0,0,.55);
    --backdrop: rgba(0,0,0,.6);
  }

  html { background: var(--bg); color-scheme: light; }
  html[data-mode="dark"] { color-scheme: dark; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }

  /* ===== Barra superior ===== */
  .topbar {
    position: sticky; top: 0; z-index: 50;
    background: var(--top-bg);
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
    padding-top: env(safe-area-inset-top);
  }
  .topbar .wrap { display: flex; align-items: center; gap: 10px; height: 60px; }
  .topbar img { width: 38px; height: 38px; border-radius: 50%; background: #fff; object-fit: contain; box-shadow: var(--shadow-sm); }
  .brand { flex: 1; min-width: 0; }
  .brand .t1 { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 17px; letter-spacing: -.01em; line-height: 1.15; }
  .brand .t2 { font-size: 12px; color: var(--muted); }

  .icon-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--surface); display: grid; place-items: center; cursor: pointer;
    box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
    transition: transform 160ms var(--ease-out);
  }
  .icon-btn svg { width: 20px; height: 20px; position: absolute; transition: transform 300ms var(--ease-out), opacity 200ms var(--ease-out); }
  .icon-btn .sun { opacity: 0; transform: rotate(-90deg) scale(.6); }
  [data-mode="dark"] .icon-btn .moon { opacity: 0; transform: rotate(90deg) scale(.6); }
  [data-mode="dark"] .icon-btn .sun { opacity: 1; transform: none; }

  /* ===== Contenido ===== */
  main { padding: 8px 0 calc(var(--tabbar-h) + 40px + env(safe-area-inset-bottom)); }
  .view { display: none; }
  .view.on { display: block; animation: viewIn 280ms var(--ease-out); }
  @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .page-h { margin: 6px 2px 16px; }
  .page-h h2 { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 26px; letter-spacing: -.02em; line-height: 1.15; }
  .page-h p { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .section-t { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 16px; margin: 22px 2px 10px; }

  .card {
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-md);
    border: 1px solid var(--card-border); overflow: hidden;
  }

  /* Meses */
  .months { position: relative; display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 16px; padding: 2px 16px 4px; scrollbar-width: none; scroll-snap-type: x proximity; }
  .months::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; border: 1px solid var(--border); background: var(--surface); color: var(--text);
    border-radius: 999px; padding: 0 16px; height: 40px; font-weight: 600; font-size: 13px; cursor: pointer;
    scroll-snap-align: center;
    transition: transform 160ms var(--ease-out), background-color 200ms var(--ease-out), color 200ms var(--ease-out);
  }
  .chip.on { background: var(--primary); color: var(--on-primary); border-color: transparent; }

  /* Tarjeta principal */
  .hero {
    border-radius: var(--radius); padding: 18px; background: var(--hero-bg); color: var(--hero-text);
    box-shadow: var(--shadow-hero); margin-bottom: 14px;
  }
  .hero .lbl { font-size: 12px; font-weight: 600; opacity: .82; letter-spacing: .02em; }
  .hero .big { font-family: var(--font-head); font-weight: 700; font-size: 34px; letter-spacing: -.02em; margin: 4px 0 14px; line-height: 1.1; }
  .split { height: 8px; border-radius: 99px; background: var(--hero-track); display: flex; overflow: hidden; gap: 2px; }
  .split span { height: 100%; transition: width 500ms var(--ease-out); }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 10px; font-size: 11.5px; opacity: .9; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

  /* Filas */
  .row {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px; width: 100%;
    background: none; border: 0; text-align: left; cursor: pointer;
    transition: transform 160ms var(--ease-out), background-color 160ms var(--ease-out);
  }
  .row.static { cursor: default; }
  .row + .row { border-top: 1px solid var(--divider); }
  .ico { width: 40px; height: 40px; border-radius: var(--radius-sm); display: grid; place-items: center; flex-shrink: 0; }
  .ico svg { width: 20px; height: 20px; }
  .ico.pos { background: color-mix(in srgb, var(--pos) 14%, transparent); color: var(--pos); }
  .ico.neg { background: color-mix(in srgb, var(--neg) 14%, transparent); color: var(--neg); }
  .ico.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .ico.pri { background: var(--primary-soft); color: var(--primary); font-weight: 700; font-size: 14px; }
  .date-ico { flex-direction: column; gap: 0; line-height: 1; background: var(--surface-2); color: var(--text); }
  .date-ico b { font-size: 15px; }
  .date-ico small { font-size: 10px; color: var(--muted); text-transform: uppercase; margin-top: 2px; }
  .row .mid { min-width: 0; flex: 1; }
  .row .name { font-weight: 600; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .sub { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .amt { font-weight: 700; font-size: 15px; white-space: nowrap; text-align: right; }
  .row .chev { width: 16px; height: 16px; color: var(--muted); flex-shrink: 0; }
  .pos-t { color: var(--pos); } .neg-t { color: var(--neg); } .warn-t { color: var(--warn); } .pri-t { color: var(--primary); }

  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; vertical-align: 1px; }
  .tag.neg { background: color-mix(in srgb, var(--neg) 14%, transparent); color: var(--neg); }
  .tag.pos { background: color-mix(in srgb, var(--pos) 14%, transparent); color: var(--pos); }
  .tag.warn { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
  .tag.pri { background: var(--primary-soft); color: var(--primary); }

  /* Barras horizontales */
  .bars { padding: 16px; display: grid; gap: 14px; }
  .hb-top { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; margin-bottom: 6px; }
  .hb-top span:first-child { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hb-top span:last-child { font-weight: 700; white-space: nowrap; }
  .hb-top em { font-style: normal; color: var(--muted); font-weight: 500; margin-left: 6px; }
  .track { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
  .fill { height: 100%; border-radius: 99px; transform-origin: left; animation: grow 600ms var(--ease-out) both; }
  @keyframes grow { from { transform: scaleX(.02); } to { transform: scaleX(1); } }

  /* Acordeón de meses */
  .acc + .acc { margin-top: 12px; }
  .acc-h {
    width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 68px;
    background: none; border: 0; cursor: pointer; text-align: left;
    transition: transform 160ms var(--ease-out);
  }
  .acc-h .mid { flex: 1; min-width: 0; }
  .acc-h .m { font-family: var(--font-head); font-weight: var(--head-weight); font-size: 17px; letter-spacing: -.01em; }
  .acc-h .c { font-size: 12px; color: var(--muted); }
  .acc-h .amt { font-weight: 700; font-size: 15px; white-space: nowrap; }
  .acc-h .chev { width: 18px; height: 18px; color: var(--muted); transition: transform 300ms var(--ease-out); flex-shrink: 0; }
  .acc.open .acc-h .chev { transform: rotate(180deg); }
  .acc-b { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 320ms var(--ease-out); }
  .acc.open .acc-b { grid-template-rows: 1fr; }
  .acc-b > div { overflow: hidden; }
  .acc-in { border-top: 1px solid var(--divider); }
  .sub-t { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 16px 16px 0; }
  .total-line { display: flex; justify-content: space-between; padding: 12px 16px 16px; font-weight: 700; border-top: 1px solid var(--divider); }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .kpi { padding: 14px; }
  .kpi .l { font-size: 12px; color: var(--muted); font-weight: 600; }
  .kpi .v { font-family: var(--font-head); font-weight: 700; font-size: 19px; letter-spacing: -.01em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Buscador */
  .search { position: relative; margin-bottom: 14px; }
  .search svg { position: absolute; left: 14px; top: 50%; width: 18px; height: 18px; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
  .search input {
    width: 100%; height: 48px; padding: 0 14px 0 42px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font: 500 16px var(--font-body); outline: none;
    box-shadow: var(--shadow-sm); transition: border-color 200ms var(--ease-out), box-shadow 200ms var(--ease-out);
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

  /* Barra inferior */
  .tabbar {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom));
    width: calc(100% - 20px); max-width: 520px; height: var(--tabbar-h); z-index: 60;
    background: var(--nav-bg); border-radius: 22px; display: flex; padding: 6px;
    box-shadow: var(--shadow-nav); border: 1px solid var(--card-border);
    backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
  }
  .tab {
    flex: 1; border: 0; background: none; color: var(--muted); cursor: pointer; border-radius: 16px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-weight: 600; font-size: 10.5px;
    transition: transform 160ms var(--ease-out), color 200ms var(--ease-out), background-color 200ms var(--ease-out);
  }
  .tab svg { width: 22px; height: 22px; }
  .tab.on { color: var(--nav-on); background: var(--nav-on-bg); }

  /* Hoja inferior (detalle) */
  .backdrop {
    position: fixed; inset: 0; z-index: 90; background: var(--backdrop);
    opacity: 0; pointer-events: none; transition: opacity 240ms var(--ease-out);
  }
  .backdrop.on { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 50%; bottom: 0; z-index: 91; width: 100%; max-width: 640px;
    max-height: 88dvh; display: flex; flex-direction: column;
    background: var(--surface); color: var(--text);
    border-radius: 24px 24px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,.25);
    transform: translate(-50%, 100%); visibility: hidden;
    transition: transform 380ms var(--ease-sheet), visibility 0s linear 380ms;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .sheet.on { transform: translate(-50%, 0); visibility: visible; transition: transform 380ms var(--ease-sheet), visibility 0s; }
  .sheet.closing { transition-duration: 220ms; }
  .sheet-grab { padding: 10px 0 4px; display: grid; place-items: center; cursor: grab; touch-action: none; }
  .sheet-grab span { width: 40px; height: 5px; border-radius: 99px; background: var(--border); }
  .sheet-h { display: flex; align-items: center; gap: 10px; padding: 4px 16px 12px; touch-action: none; }
  .sheet-h h3 { flex: 1; font-family: var(--font-head); font-weight: var(--head-weight); font-size: 20px; letter-spacing: -.01em; line-height: 1.2; }
  .sheet-b { overflow-y: auto; padding: 0 16px 20px; overscroll-behavior: contain; }
  .close-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--surface-2); cursor: pointer; display: grid; place-items: center; flex-shrink: 0; transition: transform 160ms var(--ease-out); }
  .close-btn svg { width: 18px; height: 18px; }

  .d-big { font-family: var(--font-head); font-weight: 700; font-size: 32px; letter-spacing: -.02em; margin-bottom: 8px; }
  .dl { border-radius: var(--radius-sm); background: var(--surface-2); padding: 4px 14px; }
  .dl div { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; font-size: 14px; }
  .dl div + div { border-top: 1px solid var(--divider); }
  .dl dt { color: var(--muted); }
  .dl dd { font-weight: 600; text-align: right; }
  .note { margin-top: 12px; padding: 12px 14px; border-radius: var(--radius-sm); font-size: 13.5px; background: color-mix(in srgb, var(--neg) 10%, transparent); color: var(--neg); font-weight: 600; }

  .mov { padding: 12px 14px; border-radius: var(--radius-sm); background: var(--surface-2); }
  .mov + .mov { margin-top: 8px; }
  .mov-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
  .mov-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 13px; }
  .mov-grid small { display: block; font-size: 11px; color: var(--muted); }
  .mov-grid b { font-weight: 700; }
  .mov .note { margin-top: 8px; padding: 8px 10px; font-size: 12.5px; }

  /* Esqueleto de carga */
  .skel { border-radius: var(--radius); background: var(--surface-2); position: relative; overflow: hidden; }
  .skel::after {
    content: ''; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--surface) 60%, transparent), transparent);
    animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer { to { transform: translateX(100%); } }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }

  /* Respuesta al tocar: escala sutil, nunca desde 0 */
  .chip:active, .row:not(.static):active, .tab:active, .icon-btn:active, .acc-h:active, .close-btn:active { transform: scale(.97); }
  .tabbar .tab:active { transform: scale(.94); }
  .row:not(.static):active { background: var(--surface-2); }
  @media (hover: hover) {
    .row:not(.static):hover { background: var(--surface-2); }
  }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .theming, .theming *, .theming *::before, .theming *::after { transition: background-color 280ms ease, color 280ms ease, border-color 280ms ease, box-shadow 280ms ease, fill 280ms ease, transform 300ms cubic-bezier(.23, 1, .32, 1), opacity 200ms ease !important; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <a href="index.html" aria-label="Volver al inicio"><img src="logo.png" alt="Los Lapachos"></a>
    <div class="brand"><div class="t1">Los Lapachos</div><div class="t2">Gestión financiera</div></div>
    <button class="icon-btn" id="mode-btn" aria-label="Cambiar a modo oscuro">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section class="view on" id="v-inicio">
    <div class="months" id="months"></div>
    <div id="inicio-body">
      <div class="skel" style="height:150px;margin-bottom:14px"></div>
      <div class="skel" style="height:196px"></div>
    </div>
  </section>

  <section class="view" id="v-gastos">
    <div class="page-h"><h2>Gastos</h2><p>Por mes, sin retiros. Tocá un gasto para ver el detalle.</p></div>
    <div id="gastos-list"><div class="skel" style="height:68px;margin-bottom:12px"></div><div class="skel" style="height:68px"></div></div>
  </section>

  <section class="view" id="v-ingresos">
    <div class="page-h"><h2>Ingresos</h2><p>Por mes. Tocá un ingreso para ver el detalle.</p></div>
    <div id="ingresos-list"><div class="skel" style="height:68px;margin-bottom:12px"></div><div class="skel" style="height:68px"></div></div>
  </section>

  <section class="view" id="v-proveedores">
    <div class="page-h"><h2>Proveedores</h2><p>Ordenados por deuda. Tocá uno para ver su historial.</p></div>
    <div id="proveedores-list"><div class="skel" style="height:80px;margin-bottom:12px"></div><div class="skel" style="height:260px"></div></div>
  </section>

  <section class="view" id="v-retiros">
    <div class="page-h"><h2>Retiros</h2><p>Retiros personales agrupados por mes.</p></div>
    <div id="retiros-list"><div class="skel" style="height:68px;margin-bottom:12px"></div><div class="skel" style="height:68px"></div></div>
  </section>
</main>

<nav class="tabbar" aria-label="Secciones">

  <button class="tab" data-view="ingresos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>Ingresos</button>

<div class="backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="sheet-grab"><span></span></div>
  <div class="sheet-h">
    <h3 id="sheet-title">Detalle</h3>
    <button class="close-btn" id="sheet-close" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="sheet-b" id="sheet-body"></div>
</div>

<script>
  // ===================== Datos (misma fuente que el dashboard actual) =====================
  const SHEET_ID = '1y91zkqTucSs55yb16Q8hTn6yxsv23rhl4Kg1XqdEfIg';
  const appData = { totales: [], gastos: [], ingresos: [], proveedores: [], retiros: [], formGastos: [] };

  const ICONS = {
    up: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
    user: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    chev: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>',
    down2: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>'
  };

  async function loadSheetData(sheetName, key) {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(sheetName)}`;
    const text = await (await fetch(url)).text();
    const rows = parseCSV(text);
    if (!rows.length) return;
    const headers = rows[0].map(h => String(h).trim());
    const data = rows.slice(1)
      .filter(r => r.some(c => c && String(c).trim()))
      .map(r => {
        const o = {};
        headers.forEach((h, i) => { o[cleanFieldName(h)] = cleanValue(r[i] ? String(r[i]).trim() : ''); });
        return o;
      });
    appData[key] = processSheetData(key, data);
  }

  function parseCSV(text) {
    const rows = []; let row = [], field = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i], n = text[i + 1];
      if (c === '"') { if (q && n === '"') { field += '"'; i++; } else q = !q; }
      else if (c === ',' && !q) { row.push(field); field = ''; }
      else if ((c === '\n' || c === '\r') && !q) {
        if (field || row.length) { row.push(field); rows.push(row); row = []; field = ''; }
        if (c === '\r' && n === '\n') i++;
      } else field += c;
    }
    if (field || row.length) { row.push(field); rows.push(row); }
    return rows;
  }
  function cleanFieldName(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]/g, '').trim(); }
  function cleanValue(s) { return typeof s === 'string' ? s.replace(/^["']|["']$/g, '').trim() : s; }
  function parseNumber(s) {
    if (!s) return 0;
    const n = parseFloat(String(s).replace(/\$/g, '').replace(/\s/g, '').replace(/,/g, '').replace(/[^0-9.-]/g, ''));
    return isNaN(n) ? 0 : n;
  }

  function processSheetData(type, data) {
    switch (type) {
      case 'totales': return data.map(r => ({ mes: r.mes || '', año: parseInt(r.ano) || 2026, ingresos: parseNumber(r.ingresos), gastos: parseNumber(r.gastos), retiros: parseNumber(r.retiros) })).filter(r => r.mes);
      case 'gastos': return data.map(r => ({ fecha: r.fecha || '', categoria: r.categoria || '', subcategoria: r.subcategoria || '', proveedor: r.proveedor || '', montoTotal: parseNumber(r.montototal), montoPagado: parseNumber(r.montopagado), estado: r.estado || '', observaciones: r.observaciones || '', medioPago: r.mediodepago || '' })).filter(r => r.fecha);
      case 'ingresos': return data.map(r => ({ fecha: r.fecha || '', concepto: r.concepto || '', tipo: r.tipo || '', monto: parseNumber(r.monto), medioCobro: r.mediodecobro || '', observaciones: r.observaciones || '' })).filter(r => r.fecha);
      case 'proveedores': return data.map(r => ({ nombre: r.nombredelproveedor || r.proveedor || '', totalAcumulado: parseNumber(r.totalacumulado), pagado: parseNumber(r.pagado), pendiente: parseNumber(r.pendiente), ultimaFactura: r.ultimafactura || '' })).filter(r => r.nombre);
      case 'retiros': return data.map(r => ({ fecha: r.fecha || '', montoTotal: parseNumber(r.montototal), observaciones: r.observaciones || '' })).filter(r => r.fecha);
      case 'formGastos': return data.map(r => ({ fecha: r.fecha || '', categoria: r.categoria || '', proveedor: r.proveedor || '', montoTotal: parseNumber(r.montototal), montoPagado: parseNumber(r.montopagado), estado: r.estado || '', medioPago: r.mediodepago || '', observaciones: r.observaciones || '', tipoMovimiento: r.tipodemovimiento || '' })).filter(r => r.fecha && r.categoria === 'Proveedor');
      default: return data;
    }
  }

  // ===================== Utilidades =====================
  const MESES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function parseFecha(str) {
    if (!str) return new Date(0);
    str = String(str).trim();
    if (str.includes('/')) { const [d, m, y] = str.split('/').map(Number); return new Date(y, m - 1, d); }
    return new Date(str);
  }
  // En listas y resúmenes se redondea (entra en pantalla chica); el detalle muestra el monto exacto
  const fmt0 = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 0, maximumFractionDigits: 0 });
  const fmt2 = new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const money = n => fmt0.format(n);
  const exact = n => (Math.round(n) === n ? fmt0 : fmt2).format(n);
  function fmtDate(s) {
    const d = parseFecha(s);
    return isNaN(d) ? (s || '-') : d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function dateIco(s) {
    const d = parseFecha(s);
    if (isNaN(d)) return `<div class="ico date-ico"><b>–</b></div>`;
    return `<div class="ico date-ico"><b>${d.getDate()}</b><small>${MESES[d.getMonth()].slice(0, 3)}</small></div>`;
  }
  function monthKey(s) { const d = parseFecha(s); return isNaN(d) ? 'Sin fecha' : `${MESES[d.getMonth()]} ${d.getFullYear()}`; }

  // Agrupa por mes, del más reciente al más viejo
  function groupByMonth(items, field) {
    const g = new Map();
    items.forEach(it => { const k = monthKey(it[field]); if (!g.has(k)) g.set(k, []); g.get(k).push(it); });
    return [...g.entries()]
      .map(([k, list]) => [k, list.sort((a, b) => parseFecha(b[field]) - parseFecha(a[field]))])
      .sort((a, b) => parseFecha(b[1][0][field]) - parseFecha(a[1][0][field]));
  }

  function bars(entries, colorVar, total) {
    const max = Math.max(...entries.map(e => e[1]), 1);
    return `<div class="bars">${entries.map(([label, v, color]) => `
      <div><div class="hb-top"><span>${esc(label || 'Sin dato')}</span><span class="num">${money(v)}<em>${total ? Math.round(v / total * 100) + '%' : ''}</em></span></div>
      <div class="track"><div class="fill" style="width:${(v / max * 100).toFixed(1)}%;background:var(${color || colorVar})"></div></div></div>`).join('')}</div>`;
  }
  function sumBy(items, key, val) {
    const o = {};
    items.forEach(it => { o[it[key]] = (o[it[key]] || 0) + it[val]; });
    return Object.entries(o).sort((a, b) => b[1] - a[1]);
  }

  // Registro de ítems para abrir detalles sin meter JSON en atributos
  const reg = [];
  const keep = it => reg.push(it) - 1;

  // ===================== Inicio =====================
  let mesIdx = 0;
  function renderInicio() {
    const t = appData.totales;
    if (!t.length) { document.getElementById('inicio-body').innerHTML = '<div class="empty">No hay datos de totales.</div>'; return; }
    const hoy = new Date();
    const actual = t.findIndex(x => x.mes.toLowerCase() === MESES[hoy.getMonth()].toLowerCase() && x.año === hoy.getFullYear());
    mesIdx = actual !== -1 ? actual : t.length - 1;

    const months = document.getElementById('months');
    months.innerHTML = t.map((x, i) => `<button class="chip" data-i="${i}">${esc(x.mes.slice(0, 3))} ${x.año}</button>`).join('');
    months.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      mesIdx = +b.dataset.i; paintInicio();
    });
    paintInicio();
  }

  // Centra el mes elegido en la fila de meses (sin mover la página)
  let chipsListos = false;
  function centerChip(animar) {
    const row = document.getElementById('months'), on = row.querySelector('.chip.on');
    if (!on || !row.clientWidth) return;
    row.scrollTo({ left: on.offsetLeft - (row.clientWidth - on.offsetWidth) / 2, behavior: animar && chipsListos ? 'smooth' : 'auto' });
    chipsListos = true;
  }

  function paintInicio() {
    const d = appData.totales[mesIdx];
    document.querySelectorAll('#months .chip').forEach((c, i) => c.classList.toggle('on', i === mesIdx));
    centerChip(true);

    const neto = d.ingresos - d.gastos - d.retiros;
    const base = Math.max(d.ingresos, d.gastos + d.retiros, 1);
    const pG = d.gastos / base * 100, pR = d.retiros / base * 100, pN = Math.max(neto, 0) / base * 100;
    const mes = d.mes.toLowerCase();
    const key = `${d.mes} ${d.año}`.toLowerCase();
    const cuenta = (list, noun, plural) => {
      const n = list.filter(x => monthKey(x.fecha).toLowerCase() === key).length;
      return n === 0 ? 'Sin movimientos' : `${n} ${n === 1 ? noun : plural}`;
    };

    document.getElementById('inicio-body').innerHTML = `
      <div class="hero">
        <div class="lbl">Resultado neto · ${esc(mes)} ${d.año}</div>
        <div class="big num">${money(neto)}</div>
        <div class="split"><span style="width:${pG}%;background:var(--seg-1)"></span><span style="width:${pR}%;background:var(--seg-2)"></span><span style="width:${pN}%;background:var(--seg-3)"></span></div>
        <div class="legend"><span><i style="background:var(--seg-1)"></i>Gastos ${Math.round(pG)}%</span><span><i style="background:var(--seg-2)"></i>Retiros ${Math.round(pR)}%</span><span><i style="background:var(--seg-3)"></i>Neto ${Math.round(pN)}%</span></div>
      </div>
      <div class="card">
        <button class="row" onclick="irA('ingresos','${esc(d.mes)}')"><div class="ico pos">${ICONS.down}</div><div class="mid"><div class="name">Ingresos</div><div class="sub">${cuenta(appData.ingresos, 'ingreso', 'ingresos')}</div></div><div class="amt num pos-t">${money(d.ingresos)}</div>${ICONS.chev}</button>
        <button class="row" onclick="irA('gastos','${esc(d.mes)}')"><div class="ico neg">${ICONS.up}</div><div class="mid"><div class="name">Gastos</div><div class="sub">${cuenta(appData.gastos, 'gasto', 'gastos')}</div></div><div class="amt num neg-t">${money(d.gastos)}</div>${ICONS.chev}</button>
        <button class="row" onclick="irA('retiros','${esc(d.mes)}')"><div class="ico warn">${ICONS.user}</div><div class="mid"><div class="name">Retiros</div><div class="sub">${cuenta(appData.retiros, 'retiro', 'retiros')}</div></div><div class="amt num">${money(d.retiros)}</div>${ICONS.chev}</button>
      </div>
      <div class="section-t">Comparación del mes</div>
      <div class="card">${bars([['Ingresos', d.ingresos, '--pos'], ['Gastos', d.gastos, '--neg'], ['Retiros', d.retiros, '--warn']], '--primary', 0)}</div>`;
  }

  // ===================== Acordeones por mes (Gastos / Ingresos / Retiros) =====================
  function accordion({ month, count, noun, total, totalClass, body, open }) {
    return `
      <div class="card acc ${open ? 'open' : ''}" data-mes="${esc(month.split(' ')[0])}">
        <button class="acc-h" onclick="toggleAcc(this)" aria-expanded="${open ? 'true' : 'false'}">
          <div class="mid"><div class="m">${esc(month)}</div><div class="c">${count} ${noun}</div></div>
          <div class="amt num ${totalClass}">${money(total)}</div>${ICONS.down2}
        </button>
        <div class="acc-b"><div><div class="acc-in">${body}</div></div></div>
      </div>`;
  }
  function toggleAcc(btn) {
    const acc = btn.parentElement, open = !acc.classList.contains('open');
    acc.parentElement.querySelectorAll('.acc.open').forEach(a => { a.classList.remove('open'); a.querySelector('.acc-h').setAttribute('aria-expanded', 'false'); });
    if (open) { acc.classList.add('open'); btn.setAttribute('aria-expanded', 'true'); }
  }

  function renderGastos() {
    const el = document.getElementById('gastos-list');
    if (!appData.gastos.length) { el.innerHTML = '<div class="empty">No hay gastos registrados.</div>'; return; }
    el.innerHTML = groupByMonth(appData.gastos, 'fecha').map(([month, items], gi) => {
      const sinRet = items.filter(i => i.categoria !== 'Retiro Personal');
      const total = sinRet.reduce((s, i) => s + i.montoTotal, 0);
      const rows = items.map(it => {
        const deuda = it.estado === 'A deber' ? ' <span class="tag neg">A deber</span>' : it.estado && it.estado !== 'Pagado total' ? ` <span class="tag warn">${esc(it.estado)}</span>` : '';
        return `<button class="row" onclick="detalleGasto(${keep(it)})">${dateIco(it.fecha)}
          <div class="mid"><div class="name">${esc(it.proveedor || it.subcategoria || it.categoria || 'Sin detalle')}</div><div class="sub">${esc(it.categoria)}${deuda}</div></div>
          <div class="amt num neg-t">${money(it.montoTotal)}</div></button>`;
      }).join('');
      const body = `${rows}<div class="sub-t">Por categoría</div>${bars(sumBy(sinRet, 'categoria', 'montoTotal'), '--neg', total)}
        <div class="total-line"><span>Total sin retiros</span><span class="num neg-t">${money(total)}</span></div>`;
      return accordion({ month, count: items.length, noun: items.length === 1 ? 'gasto' : 'gastos', total, totalClass: 'neg-t', body, open: gi === 0 });
    }).join('');
  }

  function renderIngresos() {
    const el = document.getElementById('ingresos-list');
    if (!appData.ingresos.length) { el.innerHTML = '<div class="empty">No hay ingresos registrados.</div>'; return; }
    el.innerHTML = groupByMonth(appData.ingresos, 'fecha').map(([month, items], gi) => {
      const total = items.reduce((s, i) => s + i.monto, 0);
      const rows = items.map(it => `<button class="row" onclick="detalleIngreso(${keep(it)})">${dateIco(it.fecha)}
          <div class="mid"><div class="name">${esc(it.concepto || it.tipo || 'Ingreso')}</div><div class="sub">${esc([it.tipo, it.medioCobro].filter(Boolean).join(' · '))}</div></div>
          <div class="amt num pos-t">${money(it.monto)}</div></button>`).join('');
      const body = `${rows}<div class="sub-t">Por tipo</div>${bars(sumBy(items, 'tipo', 'monto'), '--pos', total)}
        <div class="sub-t" style="padding-top:4px">Por medio de cobro</div>${bars(sumBy(items, 'medioCobro', 'monto'), '--accent', total)}
        <div class="total-line"><span>Total del mes</span><span class="num pos-t">${money(total)}</span></div>`;
      return accordion({ month, count: items.length, noun: items.length === 1 ? 'ingreso' : 'ingresos', total, totalClass: 'pos-t', body, open: gi === 0 });
    }).join('');
  }

  function renderRetiros() {
    const el = document.getElementById('retiros-list');
    if (!appData.retiros.length) { el.innerHTML = '<div class="empty">No hay retiros registrados.</div>'; return; }
    el.innerHTML = groupByMonth(appData.retiros, 'fecha').map(([month, items], gi) => {
      const total = items.reduce((s, i) => s + i.montoTotal, 0);
      const body = items.map(it => `<div class="row static">${dateIco(it.fecha)}
          <div class="mid"><div class="name">Retiro</div><div class="sub">${esc(it.observaciones || 'Sin observaciones')}</div></div>
          <div class="amt num">${money(it.montoTotal)}</div></div>`).join('');
      return accordion({ month, count: items.length, noun: items.length === 1 ? 'retiro' : 'retiros', total, totalClass: '', body, open: gi === 0 });
    }).join('');
  }

  // ===================== Proveedores =====================
  function renderProveedores() {
    const el = document.getElementById('proveedores-list');
    const p = appData.proveedores;
    if (!p.length) { el.innerHTML = '<div class="empty">No hay proveedores registrados.</div>'; return; }
    const deuda = p.reduce((s, x) => s + x.pendiente, 0);
    const acum = p.reduce((s, x) => s + x.totalAcumulado, 0);
    const sorted = [...p].sort((a, b) => b.pendiente - a.pendiente);
    el.innerHTML = `
      <div class="kpis">
        <div class="card kpi"><div class="l">Total adeudado</div><div class="v num neg-t">${money(deuda)}</div></div>
        <div class="card kpi"><div class="l">Total acumulado</div><div class="v num pri-t">${money(acum)}</div></div>
      </div>
      <div class="search">${ICONS.search}<input type="search" id="prov-q" placeholder="Buscar proveedor" autocomplete="off"></div>
      <div class="card" id="prov-rows">${sorted.map(x => `
        <button class="row" data-name="${esc(x.nombre.toLowerCase())}" onclick="historial(${keep(x)})">
          <div class="ico pri">${esc(x.nombre.trim().slice(0, 2).toUpperCase())}</div>
          <div class="mid"><div class="name">${esc(x.nombre)}</div><div class="sub">${x.pendiente > 0 ? 'Pendiente de pago' : '<span class="tag pos">Al día</span>'}</div></div>
          <div class="amt num ${x.pendiente > 0 ? 'neg-t' : ''}">${money(x.pendiente)}</div>${ICONS.chev}
        </button>`).join('')}
      </div>
      <div class="empty" id="prov-empty" hidden>Ningún proveedor coincide con la búsqueda.</div>`;
    document.getElementById('prov-q').addEventListener('input', e => {
      const q = e.target.value.toLowerCase().trim(); let n = 0;
      document.querySelectorAll('#prov-rows .row').forEach(r => { const ok = r.dataset.name.includes(q); r.hidden = !ok; if (ok) n++; });
      document.getElementById('prov-empty').hidden = n > 0;
      document.getElementById('prov-rows').hidden = n === 0;
    });
  }

  // ===================== Detalles (hoja inferior) =====================
  function dl(pairs) {
    return `<dl class="dl">${pairs.filter(p => p[1]).map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
  }
  function detalleGasto(i) {
    const it = reg[i];
    const tag = it.estado === 'Pagado total' ? 'pos' : it.estado === 'A deber' ? 'neg' : 'warn';
    openSheet(it.proveedor || it.subcategoria || 'Gasto', `
      <div class="d-big num neg-t">${exact(it.montoTotal)}</div>
      ${dl([['Fecha', fmtDate(it.fecha)], ['Categoría', esc(it.categoria)], ['Subcategoría', esc(it.subcategoria)], ['Proveedor', esc(it.proveedor)],
        ['Pagado', `<span class="num">${exact(it.montoPagado)}</span>`], ['Estado', it.estado ? `<span class="tag ${tag}">${esc(it.estado)}</span>` : ''], ['Medio de pago', esc(it.medioPago)]])}
      ${it.observaciones ? `<div class="note">${esc(it.observaciones)}</div>` : ''}`);
  }
  function detalleIngreso(i) {
    const it = reg[i];
    openSheet(it.tipo || 'Ingreso', `
      <div class="d-big num pos-t">${exact(it.monto)}</div>
      ${dl([['Fecha', fmtDate(it.fecha)], ['Concepto', esc(it.concepto)], ['Tipo', esc(it.tipo)], ['Medio de cobro', esc(it.medioCobro)]])}
      ${it.observaciones ? `<div class="note" style="background:var(--surface-2);color:var(--text);font-weight:500">${esc(it.observaciones)}</div>` : ''}`);
  }
  function historial(i) {
    const prov = reg[i];
    const nombre = prov.nombre.trim().toLowerCase();
    const movs = (appData.formGastos || []).filter(m => m.proveedor && m.proveedor.trim().toLowerCase() === nombre)
      .sort((a, b) => parseFecha(b.fecha) - parseFecha(a.fecha));
    const pagado = movs.reduce((s, m) => s + (m.montoPagado || 0), 0);
    const head = `<div class="kpis">
        <div class="card kpi" style="box-shadow:none;background:var(--surface-2)"><div class="l">Pendiente</div><div class="v num ${prov.pendiente > 0 ? 'neg-t' : ''}">${money(prov.pendiente)}</div></div>
        <div class="card kpi" style="box-shadow:none;background:var(--surface-2)"><div class="l">Pagado</div><div class="v num pos-t">${money(pagado)}</div></div>
      </div>`;
    const list = movs.length ? movs.map(m => {
      const fact = m.tipoMovimiento === 'Nueva factura/compra';
      return `<div class="mov">
        <div class="mov-top"><span class="tag ${fact ? 'pri' : 'pos'}">${fact ? 'Factura' : 'Pago'}</span><span class="num">${fmtDate(m.fecha)}</span></div>
        <div class="mov-grid">
          <div><small>Monto total</small><b class="num">${exact(m.montoTotal)}</b></div>
          <div><small>Pagado</small><b class="num ${m.montoPagado > 0 ? 'pos-t' : ''}">${exact(m.montoPagado)}</b></div>
          <div style="grid-column:1/-1"><small>Estado</small>${esc(m.estado || '-')}</div>
        </div>
        ${m.observaciones && m.observaciones.trim() ? `<div class="note">${esc(m.observaciones)}</div>` : ''}
      </div>`;
    }).join('') : '<div class="empty">No hay movimientos registrados para este proveedor.</div>';
    openSheet(prov.nombre, head + `<div class="sub-t" style="padding:4px 2px 10px">Historial · ${movs.length} movimientos</div>` + list +
      `<div class="total-line" style="padding:14px 2px 0;border:0"><span>Total acumulado</span><span class="num pri-t">${money(prov.totalAcumulado)}</span></div>`);
  }

  const sheet = document.getElementById('sheet'), backdrop = document.getElementById('backdrop');
  let lastFocus = null;
  function openSheet(title, html) {
    lastFocus = document.activeElement;
    document.getElementById('sheet-title').textContent = title;
    const body = document.getElementById('sheet-body');
    body.innerHTML = html; body.scrollTop = 0;
    sheet.style.transform = '';
    sheet.classList.remove('closing');
    sheet.classList.add('on'); backdrop.classList.add('on');
    document.body.style.overflow = 'hidden';
    document.getElementById('sheet-close').focus({ preventScroll: true });
  }
  function closeSheet() {
    if (!sheet.classList.contains('on')) return;
    sheet.style.transform = '';
    sheet.classList.add('closing');
    sheet.classList.remove('on'); backdrop.classList.remove('on');
    document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus({ preventScroll: true });
  }
  document.getElementById('sheet-close').addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

  // Arrastrar hacia abajo para cerrar
  (function () {
    let y0 = null, t0 = 0, dy = 0;
    const start = e => { y0 = e.clientY; t0 = performance.now(); dy = 0; sheet.style.transition = 'none'; };
    const move = e => {
      if (y0 === null) return;
      dy = Math.max(0, e.clientY - y0);
      sheet.style.transform = `translate(-50%, ${dy}px)`;
    };
    const end = () => {
      if (y0 === null) return;
      const v = dy / Math.max(1, performance.now() - t0);
      sheet.style.transition = '';
      y0 = null;
      if (dy > 110 || v > 0.6) closeSheet(); else sheet.style.transform = '';
    };
    sheet.querySelectorAll('.sheet-grab, .sheet-h').forEach(h => {
      h.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; h.setPointerCapture(e.pointerId); start(e); });
      h.addEventListener('pointermove', move);
      h.addEventListener('pointerup', end);
      h.addEventListener('pointercancel', end);
    });
  })();

  // ===================== Navegación =====================
  function show(view, push = true) {
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + view));
    document.querySelectorAll('.tab').forEach(t => {
      const on = t.dataset.view === view;
      t.classList.toggle('on', on);
      if (on) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
    if (view === 'inicio') centerChip(false);
    if (push) history.replaceState(null, '', location.search + '#' + view);
  }
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => show(t.dataset.view)));

  function irA(view, mes) {
    show(view);
    const list = document.getElementById(view + '-list');
    const acc = list && list.querySelector(`.acc[data-mes="${CSS.escape(mes)}"]`);
    if (acc && !acc.classList.contains('open')) toggleAcc(acc.querySelector('.acc-h'));
    if (acc) setTimeout(() => acc.scrollIntoView({ behavior: 'smooth', block: 'start' }), 60);
  }

  // ===================== Tema y modo oscuro =====================
  const root = document.documentElement;
  function syncThemeUI() {
    const dark = root.dataset.mode === 'dark';
    const btn = document.getElementById('mode-btn');
    btn.setAttribute('aria-label', dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
    document.querySelector('meta[name=theme-color]').content = dark ? '#121011' : '#F6F3EE';
  }
  function setMode(value) {
    const apply = () => {
      root.dataset.mode = value;
      try { localStorage.setItem('lp-mode', value); } catch (e) {}
      syncThemeUI();
    };
    // Transición corta de colores al cambiar de modo (se quita enseguida)
    root.classList.add('theming');
    apply();
    clearTimeout(window.__themingT);
    window.__themingT = setTimeout(() => root.classList.remove('theming'), 320);
  }
  document.getElementById('mode-btn').addEventListener('click', () => setMode(root.dataset.mode === 'dark' ? 'light' : 'dark'));
  syncThemeUI();

  // ===================== Arranque =====================
  (async function init() {
    const start = (location.hash || '').slice(1);
    if (['gastos', 'ingresos', 'proveedores', 'retiros'].includes(start)) show(start, false);
    try {
      await Promise.all([
        loadSheetData('TOTALES_MENSUALES', 'totales'),
        loadSheetData('GASTOS_SIN_RETIROS', 'gastos'),
        loadSheetData('INGRESOS', 'ingresos'),
        loadSheetData('PROVEEDORES', 'proveedores'),
        loadSheetData('SOLO_RETIROS', 'retiros'),
        loadSheetData('Respuestas de formulario 1', 'formGastos')
      ]);
    } catch (e) {
      console.error('Error cargando datos', e);
    }
    renderInicio(); renderGastos(); renderIngresos(); renderProveedores(); renderRetiros();
  })();
</script>
</body>
</html>
