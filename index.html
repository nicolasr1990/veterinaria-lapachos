<!DOCTYPE html>
<html lang="es" data-mode="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Veterinaria Los Lapachos</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F6F3EE">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Los Lapachos">
    <link rel="apple-touch-icon" href="Veterinaria.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        // Mismo modo (claro/oscuro) que el dashboard, aplicado antes de pintar
        (function () {
            let mode = null;
            try { mode = localStorage.getItem('lp-mode'); } catch (e) {}
            if (mode === 'light' || mode === 'dark') document.documentElement.dataset.mode = mode;
        })();
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --ease-out: cubic-bezier(.23, 1, .32, 1);
            --font: 'Plus Jakarta Sans', system-ui, sans-serif;
            --radius: 16px;
        }
        [data-mode="light"] {
            --bg: #F6F3EE; --surface: #FFFFFF; --surface-2: #F1ECE6; --text: #2A1A20; --muted: #6E6168;
            --primary: #7A1F3D; --primary-soft: #F5E8EC; --pos: #2F7D4F; --accent: #8C9A1E;
            --border: #E6DED5; --divider: #EFE9E2; --card-border: transparent;
            --shadow-sm: 0 1px 2px rgba(42,26,32,.08);
            --shadow-md: 0 1px 2px rgba(42,26,32,.05), 0 4px 14px rgba(42,26,32,.06);
            --shadow-logo: 0 1px 2px rgba(42,26,32,.06), 0 14px 32px -12px rgba(122,31,61,.35);
        }
        [data-mode="dark"] {
            --bg: #121011; --surface: #1C1719; --surface-2: #272024; --text: #F2ECEE; --muted: #A69A9F;
            --primary: #E58AA6; --primary-soft: rgba(229,138,166,.14); --pos: #7FCB8E; --accent: #C9D44E;
            --border: rgba(255,255,255,.09); --divider: rgba(255,255,255,.06); --card-border: rgba(255,255,255,.06);
            --shadow-sm: 0 0 0 1px rgba(255,255,255,.06);
            --shadow-md: inset 0 1px 0 rgba(255,255,255,.04), 0 8px 22px rgba(0,0,0,.4);
            --shadow-logo: 0 0 0 1px rgba(255,255,255,.06), 0 16px 36px -12px rgba(0,0,0,.7);
        }
        html { background: var(--bg); color-scheme: light; }
        html[data-mode="dark"] { color-scheme: dark; }

        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
            -webkit-font-smoothing: antialiased;
        }

        .mode-btn {
            position: fixed; top: calc(12px + env(safe-area-inset-top)); right: 16px;
            width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm);
            display: grid; place-items: center; cursor: pointer; overflow: hidden;
            transition: transform 160ms var(--ease-out);
        }
        .mode-btn svg { width: 20px; height: 20px; position: absolute; transition: transform 300ms var(--ease-out), opacity 200ms var(--ease-out); }
        .mode-btn .sun { opacity: 0; transform: rotate(-90deg) scale(.6); }
        [data-mode="dark"] .mode-btn .moon { opacity: 0; transform: rotate(90deg) scale(.6); }
        [data-mode="dark"] .mode-btn .sun { opacity: 1; transform: none; }

        .container { width: 100%; max-width: 420px; text-align: center; }

        .logo {
            width: 132px; height: 132px; margin: 0 auto 22px;
            border-radius: 50%; background: #fff; padding: 10px;
            box-shadow: var(--shadow-logo);
        }
        .logo img { width: 100%; height: 100%; object-fit: contain; display: block; }

        .title { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
        .subtitle { font-size: 15px; color: var(--muted); margin-top: 6px; margin-bottom: 28px; }

        .menu {
            background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-md);
            border: 1px solid var(--card-border); overflow: hidden; text-align: left;
        }
        .item {
            display: flex; align-items: center; gap: 14px; padding: 14px 16px; min-height: 72px;
            color: var(--text); text-decoration: none;
            transition: transform 160ms var(--ease-out), background-color 160ms var(--ease-out);
        }
        .item + .item { border-top: 1px solid var(--divider); }
        .ico { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
        .ico svg { width: 22px; height: 22px; }
        .ico.pri { background: var(--primary-soft); color: var(--primary); }
        .ico.pos { background: color-mix(in srgb, var(--pos) 14%, transparent); color: var(--pos); }
        .ico.acc { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
        .item .mid { flex: 1; min-width: 0; }
        .item .name { font-weight: 700; font-size: 16px; }
        .item .sub { font-size: 13px; color: var(--muted); }
        .item .chev { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }

        .item:active, .mode-btn:active { transform: scale(.97); }
        .item:active { background: var(--surface-2); }
        @media (hover: hover) { .item:hover { background: var(--surface-2); } }
        :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

        /* Entrada escalonada corta */
        .rise { animation: rise 460ms var(--ease-out) both; }
        .rise:nth-child(2) { animation-delay: 50ms; }
        .rise:nth-child(3) { animation-delay: 90ms; }
        .rise:nth-child(4) { animation-delay: 130ms; }
        @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
        .theming, .theming *, .theming *::before, .theming *::after { transition: background-color 280ms ease, color 280ms ease, border-color 280ms ease, box-shadow 280ms ease, fill 280ms ease, transform 300ms cubic-bezier(.23, 1, .32, 1), opacity 200ms ease !important; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
        }
    </style>
</head>
<body>
    <button class="mode-btn" id="mode-btn" aria-label="Cambiar a modo oscuro">
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>

    <main class="container">
        <div class="logo rise"><img src="logo.png" alt="Veterinaria Los Lapachos"></div>
        <div class="rise">
            <h1 class="title">Veterinaria Los Lapachos</h1>
            <p class="subtitle">Sistema de Gestión</p>
        </div>

        <nav class="menu rise">
            <a href="dashboard.html" class="item">
                <span class="ico pri"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg></span>
                <span class="mid"><span class="name">Ver Resúmenes</span><br><span class="sub">Ingresos, gastos, proveedores y retiros</span></span>
                <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
            </a>
            <a href="https://nicolasr1990.github.io/caja_veterinaria/" class="item">
                <span class="ico pos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg></span>
                <span class="mid"><span class="name">Caja</span><br><span class="sub">Precios de productos</span></span>
                <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
            </a>
            <a href="https://nicolasr1990.github.io/historial-clinico/" class="item">
                <span class="ico acc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v5a5 5 0 0 0 10 0V3"/><path d="M10 13v2a5 5 0 0 0 10 0v-1"/><circle cx="20" cy="12" r="2"/></svg></span>
                <span class="mid"><span class="name">Historial Clínico</span><br><span class="sub">Pacientes y consultas</span></span>
                <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>
            </a>
        </nav>
    </main>

    <script>
        const root = document.documentElement;
        function syncMode() {
            const dark = root.dataset.mode === 'dark';
            document.getElementById('mode-btn').setAttribute('aria-label', dark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro');
            document.querySelector('meta[name=theme-color]').content = dark ? '#121011' : '#F6F3EE';
        }
        document.getElementById('mode-btn').addEventListener('click', () => {
            const apply = () => {
                root.dataset.mode = root.dataset.mode === 'dark' ? 'light' : 'dark';
                try { localStorage.setItem('lp-mode', root.dataset.mode); } catch (e) {}
                syncMode();
            };
            // Transición corta de colores al cambiar de modo (se quita enseguida)
            root.classList.add('theming');
            apply();
            clearTimeout(window.__themingT);
            window.__themingT = setTimeout(() => root.classList.remove('theming'), 320);
        });
        syncMode();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .catch(err => console.warn('SW no registrado:', err));
            });
        }
    </script>
</body>
</html>
